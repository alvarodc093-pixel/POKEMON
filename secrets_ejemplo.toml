# ============================================================
# PLANTILLA de secrets para la Pokedex (SIN datos reales)
# ============================================================
# Copia este contenido y rellena los valores con los tuyos.
#
# EN LOCAL:  guardalo como  .streamlit/secrets.toml  (nunca se sube a git)
# EN STREAMLIT CLOUD:  App -> Settings -> Secrets  pega ESTE MISMO contenido.
#
# Notas:
#  - OLLAMA_API_KEY: clave de https://ollama.com/settings/keys. Si la dejas
#    vacia, la app usa el modelo local.
#  - El usuario [tidb] es el de SOLO LECTURA (pokedex_app). La app nunca usa root.
#  - El prefijo (p. ej. "AbC123xYz") forma parte del usuario: se usa completo.

OLLAMA_API_KEY = ""

[tidb]
host = "gateway01.eu-central-1.prod.aws.tidbcloud.com"
port = 4000
user = "TU_PREFIJO.pokedex_app"
password = "LaPasswordDeTuUsuarioDeSoloLectura"
database = "pokedex"

# ------------------------------------------------------------------
# SOLO PARA LOCAL (subir_datos.py), NO lo pegues en Streamlit Cloud:
# el usuario root puede borrar datos, nunca debe estar en la app.
# ------------------------------------------------------------------
